[project]
name = "readmatch-ai"
version = "0.1.0"
description = "ReadMatch AI - hybrid book recommendation portfolio project"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "fastapi>=0.115",
    "pydantic>=2.5",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "testcontainers[postgres]",
    "httpx2>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
mypy_path = "src"
packages = ["readmatch_ai"]
strict = true

[[tool.mypy.overrides]]
module = "testcontainers.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
