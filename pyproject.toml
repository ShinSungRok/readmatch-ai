[project]
name = "readmatch-ai"
version = "0.1.0"
description = "ReadMatch AI - hybrid book recommendation portfolio project"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "fastapi>=0.115",
    "pydantic>=2.5",
    "uvicorn[standard]>=0.30",
    # implicit ALS collaborative filtering (PROJECT_INSTRUCTIONS.md's approved
    # "implicit ALS" recommendation type) -- lightweight (numpy/scipy-based,
    # no torch), so unlike the `embeddings` extra this is a required
    # dependency, not optional.
    "implicit>=0.7",
    "threadpoolctl>=3.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "testcontainers[postgres]",
    "httpx2>=2.0",
]
# Optional, not part of `dev`: DeterministicFakeBookEmbeddingGenerator remains
# the default provider and all automated tests use it or a fake stand-in, so
# this heavy dependency (pulls in torch) is never required for development/CI.
embeddings = [
    "sentence-transformers>=3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
mypy_path = "src"
packages = ["readmatch_ai"]
strict = true

[[tool.mypy.overrides]]
module = "testcontainers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sentence_transformers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["implicit.*", "scipy.*", "threadpoolctl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
