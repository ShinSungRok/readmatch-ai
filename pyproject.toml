[project]
name = "readmatch-ai"
version = "0.1.0"
description = "ReadMatch AI - hybrid book recommendation portfolio project"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
mypy_path = "src"
packages = ["readmatch_ai"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
